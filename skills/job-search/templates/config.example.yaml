version: 2
workspace:
  preferences_path: "preferences.md"
  master_resume_path: "resumes/master.md"
queries:
  # Fresher QA Test Analyst (manual + automation) — the 5 curated fresher queries
  - { id: "qa-india",          keywords: "QA fresher testing",      location: "India",                  limit: 25, enabled: true }
  - { id: "qa-fresher-selenium", keywords: "QA fresher Selenium Java", location: "India",                limit: 25, enabled: true }
  - { id: "qa-trainee-associate", keywords: "QA trainee associate", location: "India",                  limit: 25, enabled: true }
  - { id: "qa-software-tester", keywords: "QA software tester",     location: "India",                  limit: 25, enabled: true }
  - { id: "qa-kolkata",        keywords: "QA Test Analyst fresher", location: "Kolkata",                limit: 25, enabled: true }
search:
  sources: [linkedin, remoteok, weworkremotely]   # job sources each query runs against: linkedin | remoteok | weworkremotely | ashby | greenhouse | lever
  freshness: "past-2-weeks"    # any | past-week | past-2-weeks | past-month — recency window (applied server-side)
  # max_new_postings_per_run: 50  # optional: positive integer or "all"; omit for first-page coverage
  # parallel_detail_reads: true # optional; set after approval to use parallel subagents where supported
schedule:
  frequency: "daily"           # hourly | every-2-hours | every-6-hours | daily | weekly — how often the search runs; unattended-first wall-clock schedule
  time: "09:00"                # HH:MM — honored by wall-clock schedulers (cron/launchd); schedule in Asia/Kolkata for India
  timezone: "Asia/Kolkata"     # IANA zone name — setup writes the system timezone; change it only to schedule in a different zone
  consented: null              # the date the user agreed to a recurring search, as YYYY-MM-DD; a scheduled, headless, or subagent run proceeds on it
notify:
  digest_path_template: "reports/{date}-digest.md"
  desktop_notify_on_block: true
